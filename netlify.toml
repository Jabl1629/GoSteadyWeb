[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["stripe", "@netlify/blobs"]
  # The existing Netlify tracer cannot resolve Stripe 22's nested exports map.
  included_files = ["node_modules/stripe/cjs/**", "node_modules/stripe/package.json"]

# Serve the GS mark when browsers request /favicon.ico
[[redirects]]
  from = "/favicon.ico"
  to = "/Assets/logo-gs-selected.png"
  status = 200

# Clean URL for the get-in-touch form (linked from the user demo's banner)
[[redirects]]
  from = "/get-in-touch"
  to = "/get-in-touch.html"
  status = 200

# The original cupholder landing page is retired; send its traffic to the homepage
[[redirects]]
  from = "/cupholder"
  to = "/"
  status = 301

[[redirects]]
  from = "/cupholder.html"
  to = "/"
  status = 301

# Clean URL for the direct-to-consumer checkout funnel
[[redirects]]
  from = "/checkout"
  to = "/checkout.html"
  status = 200

# The V2 page is now the homepage; keep its old URLs alive as permanent redirects
[[redirects]]
  from = "/cupholderV2"
  to = "/"
  status = 301

[[redirects]]
  from = "/cupholder-v2.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/checkoutV2"
  to = "/checkout-v2.html"
  status = 200

# SPA fallbacks for the Flutter demos (path URL strategy): deep links and
# mid-demo reloads (e.g. /userdemo/d2c/preview/dashboard) must serve the
# demo's index.html. No `force`, so real files (assets, main.dart.js)
# still win; only misses fall back.
[[redirects]]
  from = "/userdemo/*"
  to = "/userdemo/index.html"
  status = 200

[[redirects]]
  from = "/facilitydemo/*"
  to = "/facilitydemo/index.html"
  status = 200

# Redirect all traffic to index.html for SPA-like behavior if needed
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200
