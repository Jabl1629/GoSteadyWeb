[build]
  publish = "."

# Serve logo.png when browsers request /favicon.ico
[[redirects]]
  from = "/favicon.ico"
  to = "/logo.png"
  status = 200

# Clean URL for the get-in-touch form (linked from the user demo's banner)
[[redirects]]
  from = "/get-in-touch"
  to = "/get-in-touch.html"
  status = 200

# Clean URL for the rollator cupholder landing page (paid-traffic destination)
[[redirects]]
  from = "/cupholder"
  to = "/cupholder.html"
  status = 200

# Clean URL for the direct-to-consumer checkout funnel
[[redirects]]
  from = "/checkout"
  to = "/checkout.html"
  status = 200

# Caregiver-first V2 funnel kept separate for paid-traffic comparison
[[redirects]]
  from = "/cupholderV2"
  to = "/cupholder-v2.html"
  status = 200

[[redirects]]
  from = "/checkoutV2"
  to = "/checkout-v2.html"
  status = 200

# Public logo comparison lab for reviewing marks in the GoSteady site context
[[redirects]]
  from = "/logoLab"
  to = "/logo-concepts.html"
  status = 200

# SPA fallbacks for the Flutter demos (path URL strategy): deep links and
# mid-demo reloads (e.g. /userdemo/d2c/preview/dashboard) must serve the
# demo's index.html. No `force`, so real files (assets, main.dart.js)
# still win; only misses fall back.
[[redirects]]
  from = "/userdemo/*"
  to = "/userdemo/index.html"
  status = 200

[[redirects]]
  from = "/facilitydemo/*"
  to = "/facilitydemo/index.html"
  status = 200

# Redirect all traffic to index.html for SPA-like behavior if needed
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200
